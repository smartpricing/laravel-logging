services:
  loki:
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1::3100"
  alloy:
    image: grafana/alloy:v1.20.1
    command: run /etc/alloy/config.alloy --storage.path=/tmp/alloy
    volumes:
      - ./alloy.config:/etc/alloy/config.alloy:ro
      - ${SMOKE_LOG_DIR:?Set SMOKE_LOG_DIR to the disposable application log directory}:/logs:ro
