name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dependencies: ['latest']
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        exclude:
          - php: '8.5'
            laravel: '11'
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '11'
            testbench: '9'
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          - php: '8.2'
            laravel: '11'
            testbench: '9'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4
      - uses: smartpricing/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Install compatibility dependencies
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          DEPENDENCIES: ${{ matrix.dependencies }}
        run: |
          # Laravel 11 is tested for existing consumers. Allow its advisories only
          # in this isolated compatibility job; do not change consumer policies.
          extra=()
          if [ "$LARAVEL" = "11" ]; then extra+=(--no-security-blocking); fi
          if [ "$DEPENDENCIES" = "lowest" ]; then extra+=(--prefer-lowest --prefer-stable); fi
          composer update --with="laravel/framework:^$LARAVEL.0" --with="orchestra/testbench:^$TESTBENCH.0" --no-interaction --prefer-dist --no-progress "${extra[@]}"
      - run: composer validate --strict
      - run: composer test

  application:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        laravel: ['12', '13']
    steps:
      - uses: actions/checkout@v4
      - uses: smartpricing/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Verify installation in a fresh application
        env:
          LARAVEL: ${{ matrix.laravel }}
        run: bash tests/smoke/install.sh "$RUNNER_TEMP/logging-app" "$LARAVEL"
      - name: Verify actual ingestion with Alloy and Loki
        if: matrix.laravel == '13'
        run: bash tests/smoke/loki.sh "$RUNNER_TEMP/logging-app"
